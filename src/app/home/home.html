<div class="text-center mb-5 py-4">
  <h1 class="display-3 fw-bold mb-2">GitSearch</h1>
  <p class="text-secondary fs-5 mb-4">ALL collection of Repos on the internet</p>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="input-group shadow-sm">
        <input #query (keyup.enter)="service.searchGithub(query.value)" 
               type="text" class="form-control rounded-pill-start ps-4 bg-secondary-subtle border-0" 
               placeholder="Search GitHub repositories...">
        <button (click)="service.searchGithub(query.value)" 
                class="btn btn-primary rounded-pill-end px-4 fw-bold">Search</button>
      </div>
    </div>
  </div>
</div>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
  @for (repo of service.searchResults(); track repo.id) {
    <div class="col">
      <div class="card h-100 border-secondary-subtle rounded-4 bg-body-tertiary shadow-sm">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-center mb-3">
            <img [src]="repo.owner.avatar_url" class="rounded-circle border border-secondary me-3" width="45" height="45">
            <h5 class="card-title mb-0 text-truncate">{{ repo.name }}</h5>
          </div>
          <p class="card-text text-secondary small mb-4 flex-grow-1">{{ repo.description }}</p>
          <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top border-secondary-subtle">
            <a [href]="repo.html_url" target="_blank" class="text-decoration-none small fw-bold">View Repo</a>
            <button class="btn btn-sm btn-outline-success rounded-pill px-3" 
                    (click)="service.addItem(repo.name, repo.description, repo.owner.avatar_url, repo.html_url)">
              Favourite
            </button>
          </div>
        </div>
      </div>
    </div>
  }
</div>

@if (service.searchResults().length > 0) {
  <div class="d-flex justify-content-center align-items-center gap-3 mt-5">
    <button class="btn btn-outline-secondary rounded-pill px-4" 
            (click)="service.previousPage()" [disabled]="service.currentPage() <= 1">Previous</button>
    <span class="text-secondary small">Page {{ service.currentPage() }} of {{ service.maxPages() }}</span>
    <button class="btn btn-outline-secondary rounded-pill px-4" 
            (click)="service.nextPage()" [disabled]="service.currentPage() >= service.maxPages()">Next</button>
  </div>
}
