<div class="mb-4">
  <h2 class="fw-bold">My Saved Repositories</h2>
  <p class="text-muted">Stored in your GitSearch</p>
</div>

<div class="row g-3">
  @for (repo of service.items(); track repo._id) {
    <div class="col-md-6">
      <div class="card bg-dark border-secondary p-3">
        <div class="d-flex align-items-center">
          <img [src]="repo.image" class="rounded-circle me-3" width="50" height="50">
          <div class="flex-grow-1 overflow-hidden">
            <h6 class="mb-1 text-truncate">{{ repo.name }}</h6>
            <div class="d-flex gap-3">
              <a [href]="repo.link" target="_blank" class="small text-info text-decoration-none">Open Github</a>
              <button (click)="service.deleteItem(repo._id!)" 
                      class="btn btn-sm btn-link text-danger p-0 text-decoration-none fw-bold">
                delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  } @empty {
    <div class="col-12 text-center py-5">
      <p class="text-muted">Your database is empty</p>
    </div>
  }
</div>
